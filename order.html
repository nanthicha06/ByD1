<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ | Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">BODY SCENT</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container narrow">
        <div class="section-head text-center">
          <h1>สั่งซื้อสินค้า</h1>
          <span class="rule"></span>
          <p class="lead">กรอกข้อมูลเพื่อยืนยันคำสั่งซื้อ เราจะติดต่อกลับเพื่อแจ้งรายละเอียดการชำระเงินและจัดส่ง</p>
        </div>

        <form id="orderForm" class="form-panel">
          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input class="input" type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input class="input" type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="field--row">
            <div class="field">
              <label for="items">รายการสินค้า</label>
              <input class="input" type="text" id="items" name="items" required>
            </div>
            <div class="field">
              <label for="total">จำนวนเงินรวม (บาท)</label>
              <input class="input" type="text" id="total" name="total" inputmode="numeric" required>
            </div>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" rows="3" placeholder="เช่น ที่อยู่จัดส่ง หรือคำขอเพิ่มเติม"></textarea>
          </div>

          <button class="btn btn--solid" type="submit">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="logo">BODY SCENT</span>
      <p>กลิ่นที่ใช่...สะท้อนตัวตนในทุกโมเมนต์</p>
      <p class="small">&copy; 2026 Body Scent</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
